# PR checks: type check, lint, design guards, unit tests, build, and the
# Playwright smoke tests (every lesson, every teardown, the other pages).
# deploy.yml runs the same gate on main before shipping.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The browser comes from Playwright's CDN. Its system packages come from Ubuntu's mirrors, which
      # the runners sometimes can't reach; the runner image already has what Chromium needs to run
      # (it ships Chrome), and the missing extras are fonts no test compares, so that part may fail.
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium
        timeout-minutes: 3
        continue-on-error: true
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

  # Turnery (desktop/): type check, the updater's tests, and a build of the bundles and the window.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: app
      # The checks don't start Electron: skip downloading it.
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check && npm test && node scripts/build.mjs
        working-directory: desktop
