# Turnery site → https://turnery.linjiejim.com (arbor. and featuretree.linjiejim.com hand visitors over to it)
# Static site: built here, rsynced to /srv/turnery/releases/<sha7> on jim-server,
# then /srv/turnery/current is flipped atomically. Last 5 releases kept for rollback:
#   ssh jim-server 'ls -t /srv/turnery/releases'  → ln -sfn <release> /srv/turnery/current
# Studio API (app/server): bundled here, uploaded to /root/turnery/api/releases/<sha7>,
# `current` flipped, PM2 process `turnery-api` reloaded. Secrets: /root/turnery/shared/.env.
# Requires environment `jim-server` with DEV_SERVER_HOST / PORT / USERNAME / SSH_KEY.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: jim-server
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Brotli for the 23 MB OpenCascade wasm takes a minute; reuse it across runs.
      - uses: actions/cache@v4
        with:
          path: app/node_modules/.cache/precompress
          key: precompress-${{ hashFiles('app/package-lock.json', 'app/public/models/**/*.glb') }}
          restore-keys: precompress-
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:api
      # Smoke tests gate the deploy: a failing lesson or teardown never ships.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

      - name: Ship
        env:
          HOST: ${{ secrets.DEV_SERVER_HOST }}
          PORT: ${{ secrets.DEV_SERVER_PORT }}
          USER: ${{ secrets.DEV_SERVER_USERNAME }}
          KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          SSH="ssh -i $HOME/.ssh/deploy -p $PORT -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          SHA=${GITHUB_SHA::7}
          REL="/srv/turnery/releases/$SHA"
          API="/root/turnery/api/releases/$SHA"
          $SSH "$USER@$HOST" "mkdir -p $REL $API"
          # Hard-link files unchanged since the live release: only what changed crosses the wire.
          rsync -az --delete --link-dest=/srv/turnery/current/ -e "$SSH" dist/ "$USER@$HOST:$REL/"
          rsync -az -e "$SSH" dist-server/index.mjs server/ecosystem.config.cjs "$USER@$HOST:$API/"
          $SSH "$USER@$HOST" "set -e
            ln -sfn $API /root/turnery/api/current.tmp && mv -Tf /root/turnery/api/current.tmp /root/turnery/api/current
            mkdir -p /root/turnery/api/logs /root/turnery/api/data
            # The move from /root/arbor (2026-11-10): the old process holds the same port, so it
            # stops first and its share data comes along. Nothing to do once it is gone.
            # app/scripts/move-to-turnery.sh prepare puts the secrets in place; without them stop here.
            test -f /root/turnery/shared/.env
            source ~/.nvm/nvm.sh >/dev/null
            if pm2 describe arbor-api >/dev/null 2>&1; then
              pm2 delete arbor-api >/dev/null
              cp -an /root/arbor/api/data/. /root/turnery/api/data/
            fi
            source ~/.nvm/nvm.sh >/dev/null && pm2 startOrReload $API/ecosystem.config.cjs --update-env && pm2 save >/dev/null
            ln -sfn $REL /srv/turnery/current.tmp && mv -Tf /srv/turnery/current.tmp /srv/turnery/current
            cd /srv/turnery/releases && ls -1t | tail -n +6 | xargs -r rm -rf
            cd /root/turnery/api/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

      - name: Verify
        run: |
          SITE=https://turnery.linjiejim.com
          for url in / /lesson/revolve /models/index.json /api/health; do
            for i in 1 2 3 4 5; do
              S=$(curl -sL -o /dev/null -w '%{http_code}' "$SITE$url")
              echo "$url attempt $i: HTTP $S"; [ "$S" = "200" ] && continue 2; sleep 3
            done
            exit 1
          done
