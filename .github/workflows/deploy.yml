# Arbor → https://arbor.linjiejim.com (the old featuretree.linjiejim.com serves or redirects to it)
# Static site: built here, rsynced to /srv/arbor/releases/<sha7> on jim-server,
# then /srv/arbor/current is flipped atomically. Last 5 releases kept for rollback:
#   ssh jim-server 'ls -t /srv/arbor/releases'  → ln -sfn <release> /srv/arbor/current
# Studio API (app/server): bundled here, uploaded to /root/arbor/api/releases/<sha7>,
# `current` flipped, PM2 process `arbor-api` reloaded. Secrets: /root/arbor/shared/.env.
# Requires environment `jim-server` with DEV_SERVER_HOST / PORT / USERNAME / SSH_KEY.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: jim-server
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Brotli for the 23 MB OpenCascade wasm takes a minute; reuse it across runs.
      - uses: actions/cache@v4
        with:
          path: app/node_modules/.cache/precompress
          key: precompress-${{ hashFiles('app/package-lock.json', 'app/public/models/**/*.glb') }}
          restore-keys: precompress-
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:api
      # Smoke tests gate the deploy: a failing lesson or teardown never ships.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

      - name: Ship
        env:
          HOST: ${{ secrets.DEV_SERVER_HOST }}
          PORT: ${{ secrets.DEV_SERVER_PORT }}
          USER: ${{ secrets.DEV_SERVER_USERNAME }}
          KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          SSH="ssh -i $HOME/.ssh/deploy -p $PORT -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          SHA=${GITHUB_SHA::7}
          REL="/srv/arbor/releases/$SHA"
          API="/root/arbor/api/releases/$SHA"
          $SSH "$USER@$HOST" "mkdir -p $REL $API"
          # Hard-link files unchanged since the live release: only what changed crosses the wire.
          rsync -az --delete --link-dest=/srv/arbor/current/ -e "$SSH" dist/ "$USER@$HOST:$REL/"
          rsync -az -e "$SSH" dist-server/index.mjs server/ecosystem.config.cjs "$USER@$HOST:$API/"
          $SSH "$USER@$HOST" "set -e
            ln -sfn $API /root/arbor/api/current.tmp && mv -Tf /root/arbor/api/current.tmp /root/arbor/api/current
            mkdir -p /root/arbor/api/logs /root/arbor/api/data
            source ~/.nvm/nvm.sh >/dev/null && pm2 startOrReload $API/ecosystem.config.cjs --update-env && pm2 save >/dev/null
            ln -sfn $REL /srv/arbor/current.tmp && mv -Tf /srv/arbor/current.tmp /srv/arbor/current
            cd /srv/arbor/releases && ls -1t | tail -n +6 | xargs -r rm -rf
            cd /root/arbor/api/releases && ls -1t | tail -n +6 | xargs -r rm -rf"

      - name: Verify
        run: |
          # The new host until its DNS is live, then the old one (which serves the site, or
          # redirects to the new host once that is switched on: -L follows it).
          SITE=https://arbor.linjiejim.com
          curl -s -o /dev/null --max-time 10 "$SITE/" || SITE=https://featuretree.linjiejim.com
          echo "verifying $SITE"
          for url in / /lesson/revolve /models/index.json /api/health; do
            for i in 1 2 3 4 5; do
              S=$(curl -sL -o /dev/null -w '%{http_code}' "$SITE$url")
              echo "$url attempt $i: HTTP $S"; [ "$S" = "200" ] && continue 2; sleep 3
            done
            exit 1
          done
