# Turnery (desktop/) releases. Push a tag like turnery-v0.2.0: this builds Turnery.app for Apple silicon
# and Intel, signs it ad hoc, and opens a draft release with the two dmgs, the two update zips and
# turnery-update.json (signed with the update key, secret TURNERY_UPDATE_KEY; the old name ARBOR_UPDATE_KEY is still read). Publish the draft by
# hand: installed copies read turnery-update.json from this repository's latest published release,
# so publishing is what ships the update. Keep "latest" for Turnery (the site has no releases).
name: Turnery release

on:
  push:
    tags: ["turnery-v*"]

concurrency:
  group: turnery-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json
      # The manifest announces the tag's version and the bundles say package.json's: installed
      # copies refuse an archive whose version differs, so stop before building one.
      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          [ "$version" = "${TAG#turnery-v}" ] || { echo "::error::Tag $TAG, but desktop/package.json says $version"; exit 1; }
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - run: npm run check && npm test
        working-directory: desktop
      - run: node scripts/build.mjs && npx electron-builder --mac dir --arm64 --x64 --publish never
        working-directory: desktop
      # Without the key the job fails rather than publish a release installed copies can't take.
      - name: Sign and package
        working-directory: desktop
        env:
          TURNERY_UPDATE_KEY: ${{ secrets.TURNERY_UPDATE_KEY || secrets.ARBOR_UPDATE_KEY }}
        run: |
          test -n "$TURNERY_UPDATE_KEY" || { echo "::error::secret TURNERY_UPDATE_KEY is not set"; exit 1; }
          node scripts/release.mjs
      - name: Draft release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#turnery-v}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "Turnery $version" \
                 --notes "Turnery $version. Download the dmg for your Mac (arm64 = Apple silicon, x64 = Intel). Installed copies update themselves once this release is published."
          gh release upload "$TAG" release/upload/* --clobber
