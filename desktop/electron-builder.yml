# Turnery.app only; scripts/release.mjs signs it ad hoc and makes the dmg, the update zip and
# turnery-update.json. No Apple certificate: macOS asks once on first open (see desktop/README.md).
appId: com.linjiejim.turnery
productName: Turnery
copyright: Copyright © 2026 Jim Lin
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
# The kernel thread reads its wasm and fonts from plain files; the CLI runs them with Electron's Node.
asar: false
electronLanguages: [zh_CN, zh_TW, en]
extraResources:
  - from: resources/turnery-cli.sh
    to: bin/turnery
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dir
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Jim Lin
