<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turnery · every number lands</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ground)}
body{font-family:var(--text);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ground)}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
.abs{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;white-space:pre}
#gl{position:absolute}
#ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 26px 60px -28px rgba(20,20,20,.25),0 2px 6px rgba(20,20,20,.05)}
#card .txt{position:absolute;left:38px;top:0;height:100%;display:flex;align-items:center;font-size:34px;letter-spacing:-.015em}
#card .txt span{display:inline-block;white-space:pre}
#card .txt .ph{font-family:var(--display);font-weight:600;letter-spacing:-.03em;color:var(--accent)}
#card .caret{display:inline-block;width:2.5px;height:38px;background:var(--ink);margin-left:3px}
#send{position:absolute;right:22px;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;background:var(--ink)}
#send:after{content:"";position:absolute;left:19px;top:21px;width:13px;height:13px;border-left:3px solid #fff;border-top:3px solid #fff;transform:rotate(45deg)}
.tok{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.03em;color:var(--accent);line-height:1}
.mono{font-family:var(--mono);font-weight:400}
.mute{color:var(--mute)}
.hdr{font-family:var(--mono);font-size:21px;color:var(--mute)}
.row{font-family:var(--mono);font-size:25px;line-height:1}
.row b{font-weight:400;color:var(--ink)} .row i{font-style:normal;color:var(--mute)}
.lab{font-size:30px;line-height:1;letter-spacing:-.015em}
.sub{font-family:var(--mono);font-size:20px;line-height:1;color:var(--mute)}
.box{width:30px;height:30px;border-radius:9px;border:2px solid #cfcfca;box-sizing:border-box;transform-origin:50% 50%}
.box svg{position:absolute;left:-2px;top:-2px;width:30px;height:30px}
#knob{width:26px;height:26px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink);box-sizing:border-box;transform-origin:50% 50%}
#pval{font-family:var(--mono);font-size:28px;line-height:1}
#cap{position:absolute;left:0;right:0;top:968px;text-align:center;font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.025em;white-space:pre}
#cap span{position:absolute;left:0;right:0;top:0;display:block;will-change:transform,opacity}
#mark{font-family:var(--display);font-weight:600;font-size:168px;letter-spacing:-.045em;line-height:1}
#mark span{display:inline-block;transform-origin:50% 86%}
#tag{font-family:var(--display);font-weight:600;font-size:36px;letter-spacing:-.025em;line-height:1.3}
#url{font-family:var(--mono);font-size:22px;color:var(--mute);line-height:1}
#cur{width:30px;height:30px;transform-origin:4px 3px}
#pin{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:20px;line-height:36px;text-align:center;box-shadow:0 0 0 4px rgba(255,255,255,.92),0 8px 16px -6px rgba(20,20,20,.4);transform-origin:50% 50%}
#pin svg{position:absolute;left:0;top:0;width:36px;height:36px}
#bub{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 20px 16px;box-shadow:0 20px 44px -22px rgba(20,20,20,.35);transform-origin:0 100%}
#bub .h{font-family:var(--mono);font-size:17px;color:var(--mute);margin-bottom:7px;line-height:1}
#bub .t{font-size:28px;letter-spacing:-.015em;white-space:pre;height:34px;line-height:34px}
#bub .t i{display:inline-block;width:2px;height:28px;background:var(--ink);vertical-align:-5px;margin-left:2px}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
  </div>
  <div id="cap"></div>
  <div id="mark" class="abs"></div>
  <div id="tag" class="abs"></div>
  <div id="url" class="abs"></div>
</div>
<script src="look.js"></script>
<script src="motion.js"></script>
<script src="three.iife.js"></script>
<script>window.LANG = new URLSearchParams(location.search).get('lang') || window.LANG || 'en';</script>
<script src="comp.js"></script>
</body>
</html>
